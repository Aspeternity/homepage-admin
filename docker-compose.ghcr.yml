services:
  homepage-admin:
    image: ghcr.io/aspeternity/homepage-admin:latest
    pull_policy: always
    container_name: homepage-admin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3001:3001"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-*}
      HOMEPAGE_URL: ${HOMEPAGE_URL:-http://10.10.1.11:3000}
      HOMEPAGE_CONFIG_DIR: /config
      ADMIN_DATA_DIR: /data
      BACKUP_LIMIT: ${BACKUP_LIMIT:-50}
      DOCKER_DISCOVERY_URL: http://homepage-docker-proxy:2375
      DOCKER_PUBLIC_HOST: ${DOCKER_PUBLIC_HOST:-10.10.1.11}
      DOCKER_SERVER_NAME: ${DOCKER_SERVER_NAME:-}
      HOMEPAGE_DOCKER_PROXY_HOST: ${HOMEPAGE_DOCKER_PROXY_HOST:-homepage-docker-proxy}
      HOMEPAGE_DOCKER_PROXY_PORT: ${HOMEPAGE_DOCKER_PROXY_PORT:-2375}
      DOCKER_HIDE_INTERNAL: ${DOCKER_HIDE_INTERNAL:-true}
      WIDGET_SCHEMA_AUTO_SYNC: ${WIDGET_SCHEMA_AUTO_SYNC:-true}
      WIDGET_SCHEMA_SYNC_MODE: ${WIDGET_SCHEMA_SYNC_MODE:-interval}
      WIDGET_SCHEMA_SYNC_INTERVAL_HOURS: ${WIDGET_SCHEMA_SYNC_INTERVAL_HOURS:-24}
      WIDGET_SCHEMA_SYNC_TIME: ${WIDGET_SCHEMA_SYNC_TIME:-03:00}
      WIDGET_SCHEMA_TIMEZONE: ${WIDGET_SCHEMA_TIMEZONE:-Asia/Shanghai}
      WIDGET_SCHEMA_REF: ${WIDGET_SCHEMA_REF:-dev}
      WIDGET_SCHEMA_TIMEOUT: ${WIDGET_SCHEMA_TIMEOUT:-8}
      WIDGET_SCHEMA_WORKERS: ${WIDGET_SCHEMA_WORKERS:-10}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /opt/docker/HomePage/data/config:/config
      - /opt/docker/homepage-admin/data:/data
    depends_on:
      - docker-proxy
    networks:
      - homepage-tools
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # Shared Docker API proxy used by both Homepage and Homepage Admin.
  # It is not published to the host/LAN. POST=0 makes the exposed API read-only.
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    pull_policy: always
    container_name: homepage-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      PING: "1"
      SERVICES: "1"
      TASKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      homepage-tools:
        aliases:
          - homepage-docker-proxy

networks:
  homepage-tools:
    external: true
