# Optional example for Docker discovery.
# Deploy this stack on each Docker host that you want Homepage Admin to discover.
# The proxy is not required for Homepage Admin itself.
services:
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    pull_policy: always
    container_name: docker-socket-proxy
    restart: unless-stopped
    network_mode: bridge

    environment:
      CONTAINERS: "1"
      PING: "1"
      SERVICES: "1"
      TASKS: "1"
      POST: "0"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      # Binds on the Docker host. Restrict 2375 to trusted LAN sources with a firewall.
      # Do not expose this unencrypted Docker API port to the Internet.
      - "2375:2375"
