<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Homepage Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script defer src="{{ url_for('static', path='app.js') }}"></script>
</head>
<body data-csrf="{{ csrf }}">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/services">
        <span class="brand-mark">H</span>
        <span><strong>Homepage Admin</strong><small>可视化配置中心</small></span>
      </a>
      <nav class="nav-list">
        <a class="nav-item {% if active == 'services' %}active{% endif %}" href="/services"><span>▦</span>服务管理</a>
        <a class="nav-item {% if active == 'bookmarks' %}active{% endif %}" href="/bookmarks"><span>⌘</span>书签管理</a>
        <a class="nav-item {% if active == 'settings' %}active{% endif %}" href="/settings"><span>⚙</span>页面设置</a>
        <a class="nav-item {% if active == 'widgets' %}active{% endif %}" href="/widgets"><span>◫</span>顶部组件</a>
        <a class="nav-item {% if active == 'docker' %}active{% endif %}" href="/docker"><span>⬡</span>Docker 发现</a>
        <a class="nav-item {% if active == 'yaml' %}active{% endif %}" href="/yaml/services.yaml"><span>⌁</span>高级编辑</a>
        <a class="nav-item {% if active == 'backups' %}active{% endif %}" href="/backups"><span>↶</span>备份回滚</a>
      </nav>
      <div class="sidebar-footer">
        <a class="button secondary full" href="{{ homepage_url }}" target="_blank" rel="noopener">打开 Homepage ↗</a>
        <div class="user-row">
          <span class="avatar">{{ username[:1]|upper }}</span>
          <span class="user-name">{{ username }}</span>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="icon-button" title="退出登录" type="submit">⇥</button>
          </form>
        </div>
        <small class="muted">v{{ version }}</small>
      </div>
    </aside>

    <main class="main-content">
      <header class="mobile-header">
        <button class="icon-button" type="button" data-sidebar-toggle>☰</button>
        <strong>Homepage Admin</strong>
      </header>
      {% if ok %}<div class="alert success">{{ ok }}</div>{% endif %}
      {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
