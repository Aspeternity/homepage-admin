<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('homepage-admin-theme') || 'dark';
        const mode = ['light', 'dark', 'system'].includes(saved) ? saved : 'dark';
        const resolved = mode === 'system'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : mode;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = resolved;
      } catch (_) {}
    })();
  </script>
  <title>登录 · Homepage Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script defer src="{{ url_for('static', path='app.js') }}"></script>
</head>
<body class="login-page">
  <button class="icon-button login-theme-toggle" type="button" data-theme-cycle aria-label="切换主题" title="切换主题"><span data-theme-icon>☀</span></button>
  <main class="login-card">
    <div class="brand login-brand">
      <span class="brand-mark">H</span>
      <span><strong>Homepage Admin</strong><small>可视化配置中心</small></span>
    </div>
    <h1>欢迎回来</h1>
    <p class="muted">登录后管理 Homepage 的 YAML 配置。</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="form-stack">
      <label>用户名<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button primary full" type="submit">登录</button>
    </form>
    <small class="muted">Homepage Admin v{{ version }}</small>
  </main>
</body>
</html>
