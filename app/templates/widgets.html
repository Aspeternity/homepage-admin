{% extends "base.html" %}
{% block title %}顶部组件 · Homepage Admin{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>顶部组件</h1><p>组件按 widgets.yaml 中的顺序显示。</p></div><a class="button primary" href="/widgets/new">新增组件</a></section>
<div class="simple-list">
{% for row in rows %}
  <article class="list-row" data-widget-row data-widget-index="{{ row.index }}">
    <div class="list-index">{{ loop.index }}</div>
    <div class="list-copy"><h3>{{ row.name }}</h3><pre>{{ row.config|truncate(180) }}</pre></div>
    <div class="list-actions">
      <button class="drag-handle icon-button" type="button" draggable="true" data-widget-drag title="拖动排序">⋮⋮</button>
      <form method="post" action="/widgets/{{ row.index }}/move"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="direction" value="up"><button class="icon-button" type="submit" {% if loop.first %}disabled{% endif %}>↑</button></form>
      <form method="post" action="/widgets/{{ row.index }}/move"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="direction" value="down"><button class="icon-button" type="submit" {% if loop.last %}disabled{% endif %}>↓</button></form>
      <a class="icon-button" href="/widgets/{{ row.index }}/edit">✎</a>
      <form method="post" action="/widgets/{{ row.index }}/delete" data-confirm="确认删除组件 {{ row.name }}？"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="icon-button danger-text" type="submit">⌫</button></form>
    </div>
  </article>
{% else %}
  <section class="empty-state"><div class="empty-icon">◫</div><h2>暂无顶部组件</h2><a class="button primary" href="/widgets/new">添加组件</a></section>
{% endfor %}
</div>
{% endblock %}
