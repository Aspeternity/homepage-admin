{% extends "base.html" %}
{% block title %}高级编辑 · Homepage Admin{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>高级编辑</h1><p>保存前会校验 YAML，写入前自动备份并使用原子替换。</p></div></section>
<div class="file-tabs">{% for file in files %}<a class="file-tab {% if file == filename %}active{% endif %}" href="/yaml/{{ file }}">{{ file }}</a>{% endfor %}</div>
<form class="yaml-form" method="post" action="/yaml/{{ filename }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <textarea class="code-editor" name="content" spellcheck="false" aria-label="{{ filename }} 内容">{{ text }}</textarea>
  <div class="sticky-actions"><span class="muted">当前文件：{{ filename }}</span><button class="button primary" type="submit">校验并保存</button></div>
</form>
{% endblock %}
