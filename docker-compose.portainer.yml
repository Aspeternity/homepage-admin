services:
  homepage-admin:
    image: ghcr.io/aspeternity/homepage-admin:latest
    pull_policy: always
    container_name: homepage-admin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3001:3001"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-*}
      HOMEPAGE_URL: ${HOMEPAGE_URL:-http://10.10.1.11:3000}
      HOMEPAGE_CONFIG_DIR: /config
      ADMIN_DATA_DIR: /data
      BACKUP_LIMIT: ${BACKUP_LIMIT:-50}
      DOCKER_DISCOVERY_URL: http://docker-proxy:9100
      DOCKER_PUBLIC_HOST: ${DOCKER_PUBLIC_HOST:-10.10.1.11}
      DOCKER_SERVER_NAME: ${DOCKER_SERVER_NAME:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /opt/docker/HomePage/data/config:/config
      - /opt/docker/homepage-admin/data:/data
    depends_on:
      - docker-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  # Purpose-built read-only discovery sidecar. It mounts the Docker socket,
  # but exposes only GET /healthz and GET /api/containers to homepage-admin.
  docker-proxy:
    image: ghcr.io/aspeternity/homepage-admin:latest
    pull_policy: always
    container_name: homepage-admin-docker-proxy
    restart: unless-stopped
    user: "0:0"
    command: ["uvicorn", "app.docker_proxy:app", "--host", "0.0.0.0", "--port", "9100"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
