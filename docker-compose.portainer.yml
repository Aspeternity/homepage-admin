services:
  homepage-admin:
    image: ghcr.io/aspeternity/homepage-admin:latest
    container_name: homepage-admin
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "3001:3001"
    volumes:
      # Replace this with the real Homepage config directory on your host.
      - /path/to/homepage/config:/config
      # Replace ./data with an absolute host path in Portainer if preferred.
      - ./data:/data
