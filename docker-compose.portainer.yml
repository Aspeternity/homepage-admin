# Legacy local-image Portainer deployment.
# New deployments should prefer docker-compose.ghcr.yml after publishing to GHCR.
services:
  homepage-admin:
    image: homepage-admin:0.1.1
    container_name: homepage-admin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3001:3001"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-false}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-*}
      HOMEPAGE_URL: ${HOMEPAGE_URL}
      HOMEPAGE_CONFIG_DIR: /config
      ADMIN_DATA_DIR: /data
      BACKUP_LIMIT: ${BACKUP_LIMIT:-50}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /opt/docker/homepage/config:/config
      - /opt/docker/homepage-admin/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
