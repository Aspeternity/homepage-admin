services:
  homepage-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: homepage-admin:0.3.8
    container_name: homepage-admin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DOCKER_DISCOVERY_URL: http://homepage-docker-proxy:2375
      HOMEPAGE_DOCKER_PROXY_HOST: homepage-docker-proxy
      HOMEPAGE_DOCKER_PROXY_PORT: "2375"
    volumes:
      - ${HOMEPAGE_HOST_CONFIG_DIR:-/opt/docker/HomePage/data/config}:/config
      - ${HOMEPAGE_ADMIN_DATA_DIR:-/opt/docker/homepage-admin/data}:/data
    depends_on:
      - docker-proxy
    networks:
      - homepage-tools
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: homepage-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      PING: "1"
      SERVICES: "1"
      TASKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      homepage-tools:
        aliases:
          - homepage-docker-proxy

networks:
  homepage-tools:
    name: homepage-tools-dev
