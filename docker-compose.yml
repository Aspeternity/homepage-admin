services:
  homepage-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: homepage-admin:0.2.0
    container_name: homepage-admin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DOCKER_DISCOVERY_URL: http://docker-proxy:9100
    volumes:
      - ${HOMEPAGE_HOST_CONFIG_DIR:-/opt/docker/HomePage/data/config}:/config
      - ${HOMEPAGE_ADMIN_DATA_DIR:-/opt/docker/homepage-admin/data}:/data
    depends_on:
      - docker-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

  docker-proxy:
    image: homepage-admin:0.2.0
    container_name: homepage-admin-docker-proxy
    restart: unless-stopped
    user: "0:0"
    command: ["uvicorn", "app.docker_proxy:app", "--host", "0.0.0.0", "--port", "9100"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
